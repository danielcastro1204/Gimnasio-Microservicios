server:
  port: 8085

security:
  keycloak:
    realm: gimnasio
    auth-server-url: http://localhost:8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${security.keycloak.auth-server-url}/realms/${security.keycloak.realm}
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:notificationdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: monitoreo-grupo
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # class-service no manda __TypeId__ (ver su application.yml). Sin ese
        # header, JsonDeserializer necesita que le digamos a qué clase local
        # mapear el JSON: mismo criterio que TypePrecedence.INFERRED en Rabbit.
        spring.json.value.default.type: co.analisys.notification.domain.event.OcupacionClaseEvent
        spring.json.use.type.headers: false

# notification-service es el suscriptor: declara el exchange topic compartido
# ("gym.events") junto con SUS PROPIAS colas y bindings. Los publicadores
# (member-service, class-service) no necesitan saber que estas colas existen.
gym:
  events:
    exchange: ${GYM_EVENTS_EXCHANGE:gym.events}
  kafka:
    ocupacion-topic: ${OCUPACION_TOPIC:ocupacion-clases}

notification:
  queues:
    member-registered: ${QUEUE_MEMBER_REGISTERED:notification.member-registered.queue}
    class-events: ${QUEUE_CLASS_EVENTS:notification.class-events.queue}
  routing-keys:
    member-registered: member.registered
    class-events: class.*
