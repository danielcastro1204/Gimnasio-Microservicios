services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: gym-rabbitmq
    ports:
      - "5672:5672"   # AMQP (usado por los microservicios)
      - "15672:15672" # UI de administracion: http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
