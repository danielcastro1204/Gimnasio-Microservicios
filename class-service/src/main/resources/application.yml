server:
  port: 8082

security:
  keycloak:
    realm: gimnasio
    auth-server-url: http://localhost:8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${security.keycloak.auth-server-url}/realms/${security.keycloak.realm}
      client:
        registration:
          class-service:
            provider: keycloak
            client-id: class-service
            client-secret: class-service-secret
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${security.keycloak.auth-server-url}/realms/${security.keycloak.realm}
  application:
    name: class-service
  datasource:
    url: jdbc:h2:mem:classdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # No mandar el __TypeId__ (clase de este microservicio): el consumidor
        # (notification-service) no tiene co.analisys.clase.* en su classpath.
        # Mismo criterio que ya se usa para RabbitMQ (INFERRED en RabbitConfig).
        spring.json.add.type.headers: false

# URL de trainer-service, configurable por variable de entorno para despliegues
# distintos a localhost (docker-compose, kubernetes, etc.) sin hardcodear la URL.
services:
  trainer-service:
    url: ${TRAINER_SERVICE_URL:http://localhost:8083}

# Exchange topic compartido para eventos importantes del gimnasio (pub/sub).
# class-service publica cambios de horario (creación/actualización/cancelación);
# no conoce ni le importa quién esté suscrito (ver notification-service).
gym:
  events:
    exchange: ${GYM_EVENTS_EXCHANGE:gym.events}
  kafka:
    # Topic de streaming para monitoreo en tiempo real de ocupación de clases
    # (Parte 3 del taller). 3 particiones: alcanza para repartir por clase
    # (se publica con key = claseId) sin sobre-dimensionar para un solo broker local.
    ocupacion-topic: ${OCUPACION_TOPIC:ocupacion-clases}
    ocupacion-particiones: ${OCUPACION_PARTICIONES:3}
