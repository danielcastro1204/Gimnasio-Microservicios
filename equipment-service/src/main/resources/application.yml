server:
  port: 8084

spring:
  application:
    name: equipment-service
  datasource:
    url: jdbc:h2:mem:equipmentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
