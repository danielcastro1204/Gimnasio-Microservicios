server:
  port: 8083

security:
  keycloak:
    realm: gimnasio
    auth-server-url: http://localhost:8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${security.keycloak.auth-server-url}/realms/${security.keycloak.realm}
  application:
    name: trainer-service
  datasource:
    url: jdbc:h2:mem:trainerdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
