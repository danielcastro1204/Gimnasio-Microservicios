server:
  port: 8081

security:
  keycloak:
    realm: gimnasio
    auth-server-url: http://localhost:8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${security.keycloak.auth-server-url}/realms/${security.keycloak.realm}
  application:
    name: member-service
  datasource:
    url: jdbc:h2:mem:memberdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Todos los brokers en sync confirman antes de dar el mensaje por escrito:
      # un dato de entrenamiento no debe perderse si el broker falla.
      acks: all
      properties:
        # analytics-service no tiene co.analisys.member.* en su classpath.
        spring.json.add.type.headers: false
        enable.idempotence: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Si un mensaje se rechaza (nack) y agotó los reintentos, NO se
        # reencola en la misma cola (que lo volvería a intentar para
        # siempre): se rechaza en firme y RabbitMQ lo enruta a pagos-dlq.
        default-requeue-rejected: false

# Exchange topic compartido para eventos importantes del gimnasio (pub/sub).
# member-service solo publica; no conoce ni le importa quién esté suscrito.
gym:
  events:
    exchange: ${GYM_EVENTS_EXCHANGE:gym.events}
  kafka:
    # Parte 3.3/3.4 del taller: datos de entrenamiento de los miembros.
    # Se publica con key = miembroId para que todos los datos de un mismo miembro
    # caigan en la misma particion (orden garantizado y agregacion por key en Kafka Streams).
    entrenamiento-topic: ${ENTRENAMIENTO_TOPIC:datos-entrenamiento}
    entrenamiento-particiones: ${ENTRENAMIENTO_PARTICIONES:3}
    # Retencion del log: 30 dias. Es lo que permite a analytics-service reconstruir
    # su estado releyendo el topic desde el inicio si pierde su base de datos.
    entrenamiento-retencion-ms: ${ENTRENAMIENTO_RETENCION_MS:2592000000}
